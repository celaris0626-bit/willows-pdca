    --navy-900: #12293b; --navy-700: #1e4d6b; --navy-600: #2c6289;
    --teal-600: #3f7d69; --teal-500: #4f9880; --amber-600: #c98a3b; --red-600: #b8483f;
    --paper-0: #f4f6f7; --paper-1: #ffffff; --paper-2: #e8edf0;
    --ink-900: #1b2733; --ink-500: #5b6b78; --ink-300: #8b9aa5;
    --line: #d8dee2; --line-strong: #c1cbd1; --focus: #2c6289;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-ui);
    background: var(--paper-0);
    color: var(--ink-900);
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
  }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  button { font-family: inherit; }
  input, textarea, select { font-family: inherit; color: inherit; }

  .app-shell { max-width: 1180px; margin: 0 auto; padding-bottom: 96px; }

  /* ---- Topbar ---- */
  .topbar {
    background: linear-gradient(180deg, var(--navy-900), var(--navy-700));
    color: #eef4f8;
    padding: 14px 16px 12px;
    position: sticky; top: 0; z-index: 40;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
  }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1180px; margin: 0 auto; }
  .brand { display: flex; flex-direction: column; gap: 1px; }
  .brand .name { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
  .brand .sub { font-size: 11.5px; color: #b9cedd; letter-spacing: .04em; }
  .help-btn {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.08); color: #eef4f8; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .help-btn:hover { background: rgba(255,255,255,.18); }

  .role-switch {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    background: rgba(255,255,255,.10); border-radius: 10px; padding: 4px; margin-top: 12px;
    max-width: 1180px; margin-left: auto; margin-right: auto;
  }
  .role-switch button {
    border: none; background: transparent; color: #d7e4ec; padding: 9px 10px; border-radius: 7px;
    font-size: 13.5px; font-weight: 600; cursor: pointer; letter-spacing: .01em;
  }
  .role-switch button.active { background: var(--paper-1); color: var(--navy-900); }

  main { padding: 16px; }
  @media (min-width: 720px) { main { padding: 22px 20px; } }

  /* ---- Cards / sections ---- */
  .card {
    background: var(--paper-1); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 14px; overflow: hidden;
  }
  .card-head {
    background: var(--paper-2); padding: 10px 14px; border-bottom: 1px solid var(--line);
    font-weight: 700; font-size: 13px; color: var(--navy-700); letter-spacing: .03em;
    display: flex; align-items: center; gap: 8px;
  }
  .card-body { padding: 14px; display: flex; flex-direction: column; gap: 14px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--ink-500); }
  .field .hint { font-size: 11.5px; color: var(--ink-300); }
  textarea, input[type=text], input[type=number], input[type=month], input[type=date], select {
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 11px; font-size: 14.5px;
    background: var(--paper-0); color: var(--ink-900); width: 100%;
  }
  textarea { min-height: 68px; resize: vertical; line-height: 1.5; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  .num { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
  .grid-2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 560px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
  .grid-3 { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 640px) { .grid-3 { grid-template-columns: 1fr 1fr 1fr; } }

  .scale10 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .scale10 button {
    border: 1px solid var(--line-strong); background: var(--paper-0); color: var(--ink-500);
    border-radius: 6px; padding: 8px 0; font-size: 13px; font-weight: 700; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .scale10 button.sel { background: var(--teal-600); border-color: var(--teal-600); color: #fff; }

  /* ---- Buttons ---- */
  .btn {
    border: 1px solid var(--line-strong); background: var(--paper-1); color: var(--ink-900);
    padding: 9px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { border-color: var(--navy-600); }
  .btn.primary { background: var(--teal-600); border-color: var(--teal-600); color: #fff; }
  .btn.primary:hover { background: var(--teal-500); }
  .btn.navy { background: var(--navy-700); border-color: var(--navy-700); color: #fff; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--navy-700); }
  .btn.danger { color: var(--red-600); border-color: var(--red-600); background: transparent; }
  .btn.sm { padding: 5px 10px; font-size: 12.5px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---- Chips / status ---- */
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
  }
  .chip.gray { background: var(--paper-2); color: var(--ink-500); }
  .chip.amber { background: color-mix(in srgb, var(--amber-600) 18%, transparent); color: var(--amber-600); }
  .chip.teal { background: color-mix(in srgb, var(--teal-600) 18%, transparent); color: var(--teal-600); }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ---- Bottom action bar ---- */
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--paper-1); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; justify-content: flex-end; box-shadow: 0 -4px 14px rgba(0,0,0,.08);
  }
  .actionbar .status-note { margin-right: auto; font-size: 12px; color: var(--ink-500); align-self: center; }

  /* ---- Staff picker row ---- */
  .picker-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  .picker-row .field { min-width: 150px; flex: 1 1 150px; }

  .staff-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .staff-tabs button {
    border: 1px solid var(--line-strong); background: var(--paper-1); color: var(--ink-900);
    padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .staff-tabs button.active { background: var(--navy-700); border-color: var(--navy-700); color: #fff; }

  /* ---- Dashboard grid ---- */
  .dash-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 16px; }
  @media (min-width: 640px) { .dash-grid { grid-template-columns: repeat(3, 1fr); } }
  .dash-card {
    background: var(--paper-1); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 14px; display: flex; flex-direction: column; gap: 8px; cursor: pointer;
  }
  .dash-card:hover { border-color: var(--navy-600); }
  .dash-card .who { font-size: 14.5px; font-weight: 700; }
  .dash-card .role { font-size: 11.5px; color: var(--ink-500); }

  /* ---- Sub-tabs (sheet 1/2/3) ---- */
  .subtabs { display: flex; gap: 4px; background: var(--paper-2); border-radius: 9px; padding: 3px; margin-bottom: 14px; }
  .subtabs button {
    flex: 1; border: none; background: transparent; padding: 9px 6px; border-radius: 6px;
    font-size: 12.5px; font-weight: 700; color: var(--ink-500); cursor: pointer;
  }
  .subtabs button.active { background: var(--paper-1); color: var(--navy-700); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  /* ---- Progress table ---- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  table.progress { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 13px; }
  table.progress th, table.progress td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  table.progress th { background: var(--paper-2); color: var(--ink-500); font-size: 11.5px; font-weight: 700; position: sticky; top: 0; }
  table.progress td.month-cell { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--navy-700); }
  table.progress tr:last-child td { border-bottom: none; }

  .readonly-block {
    background: var(--paper-0); border: 1px dashed var(--line-strong); border-radius: 8px; padding: 10px 12px;
    font-size: 13.5px; white-space: pre-wrap;
  }
  .empty-note { color: var(--ink-300); font-size: 13px; padding: 6px 2px; }

  /* ---- Modal ---- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10,18,24,.55); display: flex; align-items: center; justify-content: center;
    z-index: 60; padding: 16px;
  }
  .modal {
    background: var(--paper-1); border-radius: 12px; max-width: 480px; width: 100%; max-height: 86vh; overflow-y: auto;
    padding: 20px; border: 1px solid var(--line);
  }
  .modal h3 { color: var(--navy-700); font-size: 16px; margin-bottom: 10px; }
  .modal p, .modal li { font-size: 13.5px; color: var(--ink-900); }
  .modal ol, .modal ul { padding-left: 20px; }
  .pin-dots { display: flex; gap: 10px; justify-content: center; margin: 14px 0; }
  .pin-dots span { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line-strong); }
  .pin-dots span.filled { background: var(--navy-700); border-color: var(--navy-700); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .keypad button { padding: 14px 0; font-size: 18px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper-0); cursor: pointer; font-variant-numeric: tabular-nums; }
  .keypad button:hover { border-color: var(--navy-600); }

  .toast {
    position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); z-index: 70;
    background: var(--navy-900); color: #eef4f8; padding: 9px 16px; border-radius: 999px; font-size: 13px;
    box-shadow: 0 4px 14px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  .section-label { font-size: 11.5px; font-weight: 700; color: var(--ink-300); letter-spacing: .06em; text-transform: uppercase; margin: 4px 0 -4px; }

  a { color: var(--navy-600); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<div class="app-shell">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="name">WILLOW'S 育成PDCAシート</div>
        <div class="sub" id="subline">スタッフ育成ミーティング・電子版</div>
      </div>
      <button class="help-btn" id="helpBtn" title="使い方">?</button>
    </div>
    <div class="role-switch">
      <button id="roleStaffBtn">スタッフ入力</button>
      <button id="roleManagerBtn">代表・店長（管理）</button>
    </div>
  </div>
  <main id="main"></main>
</div>

<div id="modalLayer"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var STAFF = [
    { id: "onuki", name: "小貫", position: "スタイリスト" },
    { id: "kawashima", name: "川島", position: "Jrスタイリスト" },
    { id: "sato", name: "佐藤", position: "Jrスタイリスト" }
  ];

  var MANAGER_PIN = "0124";
  var STORE_KEY = "willows_pdca_v1";
  var UI_KEY = "willows_pdca_ui_v1";

  /* ---------------- Storage layer ---------------- */
  function emptyData() {
    var records = {}, goals = {};
    STAFF.forEach(function (s) {
      records[s.id] = {};
      goals[s.id] = { position: s.position, targetPosition: "", startMonth: "", mid3: "", mid6: "", mid1y: "", progress: [] };
    });
    return { records: records, goals: goals };
  }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return emptyData();
      var parsed = JSON.parse(raw);
      var base = emptyData();
      STAFF.forEach(function (s) {
        if (parsed.records && parsed.records[s.id]) base.records[s.id] = parsed.records[s.id];
        if (parsed.goals && parsed.goals[s.id]) base.goals[s.id] = Object.assign(base.goals[s.id], parsed.goals[s.id]);
      });
      return base;
    } catch (e) { return emptyData(); }
  }

  function saveData() { localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }

  function loadUI() {
    try { return JSON.parse(localStorage.getItem(UI_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveUI() { localStorage.setItem(UI_KEY, JSON.stringify(UI)); }

  var DATA = loadData();
  var UI = loadUI();
  if (!UI.role) UI.role = "staff";
  // Force re-authentication on any device that previously self-set a PIN
  // other than the fixed MANAGER_PIN (old per-device "first entry sets the PIN" behavior).
  if (UI.managerPin && UI.managerPin !== MANAGER_PIN) {
    UI.managerUnlocked = false;
    delete UI.managerPin;
    saveUI();
  }

  /* ---------------- Helpers ---------------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (attrs[k] === null || attrs[k] === undefined || attrs[k] === false) return;
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function staffById(id) { return STAFF.filter(function (s) { return s.id === id; })[0]; }
  function currentMonth() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  function monthLabel(m) {
    if (!m) return "";
    var parts = m.split("-");
    return parts[0] + "年" + parseInt(parts[1], 10) + "月";
  }
  function esc(s) { return (s || "").replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 2400);
  }
  function debounce(fn, ms) { var t; return function () { var a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms); }; }
  function ensureMonthRecord(staffId, month) {
    if (!DATA.records[staffId][month]) DATA.records[staffId][month] = { sheet1: null, sheet2: null };
    return DATA.records[staffId][month];
  }
  function recordStatus(staffId, month) {
    var r = DATA.records[staffId][month];
    if (!r || !r.sheet1 || !r.sheet1.submittedAt) return "none";
    if (!r.sheet2 || !r.sheet2.savedAt) return "submitted";
    return "reviewed";
  }
  function statusChip(status) {
    if (status === "none") return el("span", { class: "chip gray" }, ["未提出"]);
    if (status === "submitted") return el("span", { class: "chip amber" }, ["提出済み・面談待ち"]);
    return el("span", { class: "chip teal" }, ["面談済み"]);
  }

  /* ---------------- Download / import ---------------- */
  function offerDownload(filename, obj) {
    try {
      var blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = el("a", { href: url, download: filename, style: "display:none" });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      toast("書き出しました：" + filename);
    } catch (e) {
      toast("ファイル書き出しに失敗しました。「テキストをコピー」をお使いください。");
    }
  }
  function readJsonFile(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      try { cb(null, JSON.parse(reader.result)); } catch (e) { cb(e); }
    };
    reader.onerror = function () { cb(reader.error); };
    reader.readAsText(file);
  }

  /* ---------------- Modal helpers ---------------- */
  function closeModal() { $("#modalLayer").innerHTML = ""; }
  function openModal(contentEl) {
    var layer = $("#modalLayer");
    layer.innerHTML = "";
    var backdrop = el("div", { class: "modal-backdrop", onclick: function (e) { if (e.target === backdrop) closeModal(); } });
    var modal = el("div", { class: "modal" }, [contentEl]);
    backdrop.appendChild(modal);
    layer.appendChild(backdrop);
  }

  function showHelp() {
    var body = el("div", {}, []);
    body.appendChild(el("h3", {}, ["使い方 / このアプリについて"]));
    body.appendChild(el("p", {}, [
      "このアプリはWILLOW'Sのスタッフ育成ミーティングシート（本人記入・面談記録・個人目標管理）を、紙の代わりにスマホやPCで記入するためのものです。"
    ]));
    body.appendChild(el("p", {}, ["【重要】このアプリはスタッフ同士・店長とリアルタイムには自動同期しません。データは各自の端末（ブラウザ）の中に保存されます。次の流れで運用してください："]));
    var ol = el("ol", {}, [
      el("li", {}, ["スタッフは「スタッフ入力」で①本人記入シートを記入し、「提出する」を押す"]),
      el("li", {}, ["「ファイルを書き出す」でJSONファイルを保存し、LINE等で店長に送る（またはミーティング時にその場でスマホ画面を見せてもよい）"]),
      el("li", {}, ["店長は「代表・店長（管理）」で該当スタッフを開き、届いたJSONファイルを「インポート」する"]),
      el("li", {}, ["面談中に②面談記録を入力し、③個人目標管理に反映する"])
    ]);
    body.appendChild(ol);
    body.appendChild(el("p", {}, ["管理者データは端末のブラウザに保存されるため、機種変更前には「全データ書き出し」でバックアップを取ってください。"]));
    body.appendChild(el("div", { class: "btn-row", style: "margin-top:8px;justify-content:flex-end" }, [
      el("button", { class: "btn primary", onclick: closeModal }, ["閉じる"])
    ]));
    openModal(body);
  }
  $("#helpBtn").addEventListener("click", showHelp);

  /* ================= STAFF MODE ================= */
  function renderStaffMode() {
    var main = $("#main");
    main.innerHTML = "";
    var staffId = UI.staffSelf || STAFF[0].id;
    var month = UI.staffMonth || currentMonth();
    UI.staffSelf = staffId; UI.staffMonth = month; saveUI();

    var picker = el("div", { class: "picker-row" });
    var nameField = el("div", { class: "field" }, [
      el("label", {}, ["あなたの名前"]),
    ]);
    var select = el("select", { onchange: function (e) { UI.staffSelf = e.target.value; saveUI(); renderStaffMode(); } },
      STAFF.map(function (s) { return el("option", { value: s.id, selected: s.id === staffId ? "selected" : null }, [s.name + "（" + s.position + "）"]); }));
    nameField.appendChild(select);
    picker.appendChild(nameField);

    var monthField = el("div", { class: "field" }, [el("label", {}, ["対象月"])]);
    var monthInput = el("input", { type: "month", value: month, onchange: function (e) { UI.staffMonth = e.target.value || currentMonth(); saveUI(); renderStaffMode(); } });
    monthField.appendChild(monthInput);
    picker.appendChild(monthField);
    main.appendChild(picker);

    var rec = ensureMonthRecord(staffId, month);
    var s1 = rec.sheet1 || {};
    var submitted = !!s1.submittedAt;

    if (submitted) {
      main.appendChild(el("div", { class: "chip teal", style: "margin-bottom:10px" }, ["提出済み（" + new Date(s1.submittedAt).toLocaleString("ja-JP") + "）"]));
    }

    main.appendChild(el("button", { class: "btn sm ghost", style: "margin-bottom:10px", onclick: function () {
      UI.staffShowHistory = !UI.staffShowHistory; saveUI(); renderStaffMode();
    } }, [UI.staffShowHistory ? "過去の記録を閉じる ▲" : "過去の記録を見る ▼"]));

    if (UI.staffShowHistory) {
      var pastMonths = Object.keys(DATA.records[staffId] || {}).sort().reverse();
      var histRows = pastMonths.length
        ? pastMonths.map(function (m) {
            var status = recordStatus(staffId, m);
            return el("div", { class: "btn-row", style: "justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)" }, [
              el("div", {}, [el("strong", {}, [monthLabel(m)])]),
              statusChip(status),
              el("button", { class: "btn sm", onclick: function () { UI.staffMonth = m; saveUI(); renderStaffMode(); } }, [m === month ? "表示中" : "開く"])
            ]);
          })
        : [el("div", { class: "empty-note" }, ["まだ記録がありません。"])];
      main.appendChild(el("div", { class: "card" }, [
        el("div", { class: "card-head" }, ["過去の記録（自分の分のみ）"]),
        el("div", { class: "card-body" }, histRows)
      ]));
    }

    function field(labelText, key, opts) {
      opts = opts || {};
      var wrap = el("div", { class: "field" });
      wrap.appendChild(el("label", {}, [labelText]));
      if (opts.hint) wrap.appendChild(el("div", { class: "hint" }, [opts.hint]));
      var input;
      if (opts.textarea) {

  function promptPin() {
    var entered = "";
    var body = el("div", {});
    body.appendChild(el("h3", {}, ["管理者PINを入力"]));
    var dots = el("div", { class: "pin-dots" }, [0, 1, 2, 3].map(function () { return el("span", {}); }));
    body.appendChild(dots);
    var errNote = el("p", { style: "color:var(--red-600);min-height:18px;font-size:12.5px;text-align:center" }, [""]);
    body.appendChild(errNote);
    var keypad = el("div", { class: "keypad" });
    function updateDots() {
      $all("span", dots).forEach(function (d, i) { d.classList.toggle("filled", i < entered.length); });
    }
    function pressDigit(d) {
      if (entered.length >= 4) return;
      entered += d; updateDots();
      if (entered.length === 4) {
        if (entered === MANAGER_PIN) {
          UI.managerUnlocked = true; saveUI();
          closeModal(); renderManagerMode();
        } else {
          errNote.textContent = "PINが違います";
          entered = ""; updateDots();
        }
      }
    }
    ["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(function (k) {
      if (k === "") { keypad.appendChild(el("div", {})); return; }
      keypad.appendChild(el("button", { type: "button", onclick: function () {
        if (k === "⌫") { entered = entered.slice(0, -1); updateDots(); } else pressDigit(k);
      } }, [k]));
    });
    body.appendChild(keypad);
    body.appendChild(el("div", { class: "btn-row", style: "margin-top:12px;justify-content:flex-end" }, [
      el("button", { class: "btn ghost", onclick: function () { closeModal(); UI.role = "staff"; saveUI(); render(); } }, ["キャンセル"])
    ]));
    openModal(body);
  }

    var g = DATA.goals[staffId];

    var row = { month: month, achieved: s2.b3 || "", issue: s2.b4 || "", nextGoal: s2.d8 || "", memo: s2.d9 || "" };
    if (existingIdx >= 0) {
      if (!confirm(monthLabel(month) + " の記録は既にあります。上書きしますか？")) return;
      g.progress[existingIdx] = row;
    } else {
      g.progress.push(row);
      g.progress.sort(function (a, b) { return a.month < b.month ? -1 : 1; });
    }
    saveData();
    toast("③目標管理表に反映しました");

    renderManagerMode();

  function importFlow() {
    var input = el("input", { type: "file", accept: "application/json,.json", style: "display:none" });
    input.addEventListener("change", function () {
      var f = input.files && input.files[0];
      if (!f) return;
      readJsonFile(f, function (err, obj) {
        if (err || !obj || obj.type !== "sheet1" || !obj.staffId || !obj.month) {
          toast("ファイルの読み込みに失敗しました。①本人記入シートの書き出しファイルを選んでください。");
          return;
        }
        if (!DATA.records[obj.staffId]) { toast("不明なスタッフのデータです。"); return; }
        var rec = ensureMonthRecord(obj.staffId, obj.month);
        rec.sheet1 = obj.sheet1;
        saveData();
        managerSelectedStaff = obj.staffId;
        managerSelectedMonth = obj.month;
        managerActiveTab = "sheet1";
        toast((staffById(obj.staffId) || {}).name + "さんの" + monthLabel(obj.month) + "分を取り込みました");
        renderManagerMode();
      });
    });
    document.body.appendChild(input);
    input.click();
    setTimeout(function () { document.body.removeChild(input); }, 3000);
  }

  function backupExport() {
    offerDownload("willows_pdca_backup_" + currentMonth() + ".json", { type: "full-backup", exportedAt: new Date().toISOString(), data: DATA });
  }
  function backupImportFlow() {
    if (!confirm("全データ復元を行うと、現在この端末にあるデータは上書きされます。続けますか？")) return;
    var input = el("input", { type: "file", accept: "application/json,.json", style: "display:none" });
    input.addEventListener("change", function () {
      var f = input.files && input.files[0];
      if (!f) return;
      readJsonFile(f, function (err, obj) {
        if (err || !obj || obj.type !== "full-backup" || !obj.data) { toast("バックアップファイルとして読み込めませんでした。"); return; }
        DATA = obj.data;
        saveData();
        toast("データを復元しました");
        renderManagerMode();
      });
    });
    document.body.appendChild(input);
    input.click();
    setTimeout(function () { document.body.removeChild(input); }, 3000);
  }

  /* ================= Role switching / init ================= */
  function render() {
    $("#roleStaffBtn").classList.toggle("active", UI.role === "staff");
    $("#roleManagerBtn").classList.toggle("active", UI.role === "manager");
    $("#subline").textContent = UI.role === "staff" ? "スタッフ入力モード" : "代表・店長 管理モード";
    if (UI.role === "staff") renderStaffMode();
    else renderManagerMode();
  }
  $("#roleStaffBtn").addEventListener("click", function () { UI.role = "staff"; saveUI(); render(); });
  $("#roleManagerBtn").addEventListener("click", function () { UI.role = "manager"; saveUI(); render(); });

  render();
})();
</script>

</body>
</html>
