    --teal-600: #a8496f; --teal-500: #bd6084; --amber-600: #c98a3b; --red-600: #b8483f;
    --paper-0: #f6f4f5; --paper-1: #ffffff; --paper-2: #eee7ea;
    --ink-900: #251820; --ink-500: #6b5763; --ink-300: #9c8a93;
    --line: #ddd0d6; --line-strong: #c7b3bd; --focus: #8a3d5c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font-ui); background: var(--paper-0); color: var(--ink-900); -webkit-font-smoothing: antialiased; line-height: 1.5; }

  input, textarea, select { font-family: inherit; color: inherit; }
  /* iOS: inputs must be >=16px or Safari auto-zooms on focus */
  input, textarea, select { font-size: 16px; }
  .app-shell { max-width: 900px; margin: 0 auto; padding-bottom: 118px; }

  .topbar { background: linear-gradient(180deg, var(--navy-900), var(--navy-700)); color: #eef4f8; padding: 14px 16px 12px; position: sticky; top: 0; z-index: 40; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand .name { font-size: 15px; font-weight: 700; }
  .brand .sub { font-size: 11.5px; color: #b9cedd; }
  .icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); color: #eef4f8; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
  .role-switch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: rgba(255,255,255,.10); border-radius: 10px; padding: 4px; margin-top: 12px; }
  .role-switch button { border: none; background: transparent; color: #d7e4ec; padding: 10px 6px; border-radius: 7px; font-size: 12.5px; font-weight: 700; cursor: pointer; min-height: 40px; }
  .role-switch button.active { background: var(--paper-1); color: var(--navy-900); }

  main { padding: 14px 16px; }

  .card { background: var(--paper-1); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .card-head { background: var(--paper-2); padding: 10px 13px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 12.5px; color: var(--navy-700); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .card-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--ink-500); }
  input[type=text], input[type=number], input[type=month], input[type=date], select, textarea {
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 11px;
    background: var(--paper-0); color: var(--ink-900); width: 100%; min-height: 42px;
  }
  textarea { min-height: 100px; font-family: var(--font-mono); font-size: 13px; resize: vertical; }

  .btn { border: 1px solid var(--line-strong); background: var(--paper-1); color: var(--ink-900); padding: 10px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; min-height: 40px; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--teal-600); border-color: var(--teal-600); color: #fff; }
  .btn.navy { background: var(--navy-700); border-color: var(--navy-700); color: #fff; }
  .btn.danger { color: var(--red-600); border-color: var(--red-600); background: transparent; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--navy-700); }
  .btn.sm { padding: 7px 11px; font-size: 12px; min-height: 34px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .subtabs { display: flex; gap: 4px; background: var(--paper-2); border-radius: 9px; padding: 3px; margin-bottom: 10px; overflow-x: auto; }
  .subtabs button { flex: 1; white-space: nowrap; border: none; background: transparent; padding: 9px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 700; color: var(--ink-500); cursor: pointer; min-height: 40px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .subtabs button.active { background: var(--paper-1); color: var(--navy-700); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .subtabs button .badge { font-size: 9.5px; color: var(--ink-300); font-variant-numeric: tabular-nums; }
  .subtabs button.active .badge { color: var(--teal-600); }

  .progress-line { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
  .progress-track { flex: 1; height: 6px; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--teal-600); border-radius: 999px; }
  .progress-text { font-size: 11px; color: var(--ink-500); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .search-row input { flex: 1; }

  .group-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; cursor: pointer; background: var(--paper-2); border-bottom: 1px solid var(--line); }
  .group-head .lbl { font-size: 12.5px; font-weight: 700; color: var(--navy-700); letter-spacing: .02em; }
  .group-head .meta { font-size: 10.5px; color: var(--ink-500); font-variant-numeric: tabular-nums; }

  .item-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .item-row:last-child { border-bottom: none; }
  .item-row.counted { background: color-mix(in srgb, var(--teal-600) 6%, transparent); }
  .item-info { flex: 1; min-width: 0; }
  .item-info .nm { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-info .meta { font-size: 10.5px; color: var(--ink-500); font-variant-numeric: tabular-nums; margin-top: 1px; }
  .stepper { display: flex; align-items: center; gap: 4px; flex: none; }
  .stepper button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper-0); font-size: 17px; font-weight: 700; cursor: pointer; color: var(--navy-700); flex: none; }
  .stepper button:active { background: var(--paper-2); }
  .stepper input { width: 52px; text-align: center; padding: 6px 2px; font-variant-numeric: tabular-nums; min-height: 36px; }
  .item-value { width: 68px; text-align: right; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-900); flex: none; }

  .totalbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--paper-1); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 14px rgba(0,0,0,.08); }
  .totalbar .row1 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .totalbar .grand { font-size: 18px; font-weight: 800; color: var(--navy-700); font-variant-numeric: tabular-nums; }
  .totalbar .lbl { font-size: 11px; color: var(--ink-500); }

  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 700; }
  .chip.gray { background: var(--paper-2); color: var(--ink-500); }
  .chip.teal { background: color-mix(in srgb, var(--teal-600) 18%, transparent); color: var(--teal-600); }
  .chip.amber { background: color-mix(in srgb, var(--amber-600) 18%, transparent); color: var(--amber-600); }

  .master-row { display: flex; align-items: center; gap: 6px; padding: 9px 6px; border-bottom: 1px solid var(--line); }
  .master-row.header-row { background: color-mix(in srgb, var(--amber-600) 12%, transparent); border-radius: 6px; }
  .master-row input[type=text] { font-size: 13px; padding: 8px 9px; min-height: 38px; }
  .master-row .w-name { flex: 2; min-width: 0; }
  .master-row .w-vol { flex: 1; min-width: 0; max-width: 70px; }
  .master-row .w-price { flex: 1; min-width: 0; max-width: 80px; }
  .master-row select { font-size: 11.5px; padding: 6px 4px; min-height: 38px; max-width: 84px; }
  .master-actions { display: flex; gap: 4px; flex-wrap: wrap; }

  .hint { font-size: 11.5px; color: var(--ink-300); line-height: 1.6; }
  .empty-note { color: var(--ink-300); font-size: 13px; padding: 12px 4px; }
  .toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); z-index: 70; background: var(--navy-900); color: #eef4f8; padding: 10px 18px; border-radius: 999px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 88vw; text-align: center; }
  .toast.show { opacity: 1; }
  a { color: var(--navy-600); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<div class="app-shell">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="name">WILLOW'S 棚卸しアプリ</div>
        <div class="sub" id="subline">在庫数を数えて入力するだけ</div>
      </div>
      <button class="icon-btn" id="helpBtn">?</button>
    </div>
    <div class="role-switch">
      <button id="tabCount">棚卸し入力</button>
      <button id="tabMaster">商品マスタ</button>
      <button id="tabHistory">履歴</button>
    </div>
  </div>
  <main id="main"></main>
</div>
<div id="modalLayer"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var STORE_KEY = "willows_inv_v2";
  var UI_KEY = "willows_inv_ui_v2";
  var OLD_STORE_KEY = "willows_inv_v1";

  function defaultData() {
    return {
      categories: [
        { id: "cat1", name: "①一般在庫" },
        { id: "cat2", name: "②オージュア(業務用)" },
        { id: "cat3", name: "③オージュア(店販)" }
      ],
      items: [],
      months: {}
    };
  }

  function migrateFromV1() {
    try {
      var raw = localStorage.getItem(OLD_STORE_KEY);
      if (!raw) return null;
      var old = JSON.parse(raw);
      var d = defaultData();
      d.categories = old.categories && old.categories.length ? old.categories : d.categories;
      d.months = old.months || {};
      // group by categoryId preserving original order, inserting a header item whenever the old "group" value changes
      var byCat = {};
      (old.items || []).forEach(function (it) { (byCat[it.categoryId] = byCat[it.categoryId] || []).push(it); });
      var newItems = [];
      Object.keys(byCat).forEach(function (catId) {
        var lastGroup = undefined;
        byCat[catId].forEach(function (it) {
          var g = it.group || null;
          if (g !== lastGroup && g) {
            newItems.push({ id: "hdr" + Math.random().toString(36).slice(2), categoryId: catId, type: "header", name: g, volume: "", unitPrice: 0 });
          }
          newItems.push({ id: it.id, categoryId: catId, type: "item", name: it.name, volume: it.volume || "", unitPrice: it.unitPrice || 0 });
          lastGroup = g;
        });
      });
      d.items = newItems;
      return d;
    } catch (e) { return null; }
  }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (!d.categories) d.categories = defaultData().categories;
        if (!d.items) d.items = [];
        if (!d.months) d.months = {};
        return d;
      }
      var migrated = migrateFromV1();
      if (migrated) return migrated;
      return defaultData();
    } catch (e) { return defaultData(); }
  }
  function saveData() { localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }
  function loadUI() { try { return JSON.parse(localStorage.getItem(UI_KEY)) || {}; } catch (e) { return {}; } }
  function saveUI() { localStorage.setItem(UI_KEY, JSON.stringify(UI)); }

  var DATA = loadData();
  var UI = loadUI();
  if (!UI.tab) UI.tab = "count";
  if (!UI.countCat) UI.countCat = DATA.categories[0] ? DATA.categories[0].id : null;
  if (!UI.masterCat) UI.masterCat = DATA.categories[0] ? DATA.categories[0].id : null;

  function $(sel, root) { return (root || document).querySelector(sel); }
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (attrs[k] === null || attrs[k] === undefined || attrs[k] === false) return;
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c !== null && c !== undefined) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function uid() { return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function yen(n) { return "¥" + Math.round(n || 0).toLocaleString("ja-JP"); }
  function currentMonth() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
  function monthLabel(m) { if (!m) return ""; var p = m.split("-"); return p[0] + "年" + parseInt(p[1], 10) + "月"; }
  function toast(msg) { var t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 2600); }
  function debounce(fn, ms) { var t; return function () { var a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms); }; }

  function ensureMonth(m) { if (!DATA.months[m]) DATA.months[m] = { counts: {}, finalizedAt: null }; return DATA.months[m]; }
  function catItemsOrdered(catId) { return DATA.items.filter(function (it) { return it.categoryId === catId; }); }
  function countableItems(catId) { return catItemsOrdered(catId).filter(function (it) { return it.type !== "header"; }); }
  function itemValue(item, qty) { return (item.unitPrice || 0) * (qty || 0); }
  function monthCategoryTotal(m, catId) { var rec = ensureMonth(m); return countableItems(catId).reduce(function (s, it) { return s + itemValue(it, rec.counts[it.id] || 0); }, 0); }
  function monthGrandTotal(m) { return DATA.categories.reduce(function (s, c) { return s + monthCategoryTotal(m, c.id); }, 0); }
  function findPreviousMonthWithData(month) {
    var months = Object.keys(DATA.months).filter(function (m) {
      return m < month && DATA.months[m].counts && Object.keys(DATA.months[m].counts).length > 0;
    }).sort();
    return months.length ? months[months.length - 1] : null;
  }
  function categoryProgress(m, catId) {
    var rec = ensureMonth(m); var items = countableItems(catId);
    var counted = items.filter(function (it) { return (rec.counts[it.id] || 0) > 0; }).length;
    return { counted: counted, total: items.length };
  }

  function offerDownload(filename, textContent, mime) {
    try {
      var blob = new Blob([textContent], { type: mime || "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = el("a", { href: url, download: filename, style: "display:none" });
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      toast("書き出しました：" + filename);
    } catch (e) { toast("書き出しに失敗しました"); }
  }
  function csvEscape(s) { s = String(s == null ? "" : s); if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"'; return s; }

  /* ---------------- Modal helpers ---------------- */
  function closeModal() { $("#modalLayer").innerHTML = ""; }
  function openModal(contentEl) {
    var layer = $("#modalLayer"); layer.innerHTML = "";
    var backdrop = el("div", { style: "position:fixed;inset:0;background:rgba(10,18,24,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60", onclick: function (e) { if (e.target === backdrop) closeModal(); } });
    var modal = el("div", { style: "background:var(--paper-1);border-radius:16px 16px 0 0;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:none" }, [contentEl]);
    backdrop.appendChild(modal); layer.appendChild(backdrop);
  }
  function confirmModal(message, okLabel, onYes) {
    var body = el("div", {}, [
      el("p", { style: "font-size:14.5px;margin:0 0 18px;color:var(--ink-900)" }, [message]),
      el("div", { class: "btn-row", style: "justify-content:flex-end" }, [
        el("button", { class: "btn", onclick: closeModal }, ["キャンセル"]),
        el("button", { class: "btn danger", onclick: function () { closeModal(); onYes(); } }, [okLabel || "削除する"])
      ])
    ]);
    openModal(body);
  }
  function formModal(opts) {
    var inputs = {};
    var body = el("div", {});
    body.appendChild(el("h3", { style: "color:var(--navy-700);margin:0 0 14px;font-size:16px" }, [opts.title]));
    opts.fields.forEach(function (f) {
      var wrap = el("div", { class: "field", style: "margin-bottom:12px" });
      wrap.appendChild(el("label", {}, [f.label]));
      var input = el("input", { type: "text", inputmode: f.numeric ? "decimal" : null, placeholder: f.placeholder || "" });
      input.value = f.value || "";
      inputs[f.key] = input;
      wrap.appendChild(input);
      body.appendChild(wrap);
    });
    body.appendChild(el("div", { class: "btn-row", style: "justify-content:flex-end;margin-top:4px" }, [
      el("button", { class: "btn", onclick: closeModal }, ["キャンセル"]),
      el("button", { class: "btn primary", onclick: function () {
        var vals = {}; opts.fields.forEach(function (f) { vals[f.key] = inputs[f.key].value.trim(); });
        if (opts.validate) { var err = opts.validate(vals); if (err) { toast(err); return; } }
        closeModal(); opts.onSave(vals);
      } }, [opts.saveLabel || "保存"])
    ]));
    openModal(body);
    setTimeout(function () { var first = opts.fields[0] && inputs[opts.fields[0].key]; if (first) first.focus(); }, 80);
  }

  function showHelp() {
    var body = el("div", {}, [
      el("h3", { style: "color:var(--navy-700);margin:0 0 12px" }, ["使い方"]),
      el("p", { style: "font-size:13.5px" }, ["① 初回だけ「商品マスタ」タブで、Excelの棚卸表から「名称・容量・仕入単価」をコピーして貼り付け、商品を取り込みます。"]),
      el("p", { style: "font-size:13.5px" }, ["② 「店販商品」のような見出し行は、取り込むと最初は普通の商品として並びます。その行の「見出しに変換」をタップすると見出しになります。"]),
      el("p", { style: "font-size:13.5px" }, ["③ 毎月は「棚卸し入力」タブで対象月を選び、数えた在庫数を入力するだけ。金額は自動計算されます。入力済みの行はうっすら緑色になります。"]),
      el("p", { style: "font-size:13.5px" }, ["④ 数え終わったら「この月を確定する」→「税理士提出用CSVを書き出す」でファイルを保存できます。"]),
      el("div", { class: "btn-row", style: "justify-content:flex-end;margin-top:8px" }, [el("button", { class: "btn primary", onclick: closeModal }, ["閉じる"])])
    ]);
    openModal(body);
  }
  $("#helpBtn").addEventListener("click", showHelp);

  /* ---------------- Import parsing (no auto header-guessing) ---------------- */
  function parseImportText(text) {
    var lines = text.split(/\r\n|\r|\n/).filter(function (l) { return l.trim().length > 0; });
    var items = [];
    lines.forEach(function (line) {
      var cols = (line.indexOf("\t") >= 0 ? line.split("\t") : line.split(",")).map(function (c) { return (c || "").trim(); });
      if (cols.length > 3) cols = cols.slice(0, 3);
      var name, volume = "", priceRaw;
      if (cols.length >= 3) { name = cols[0]; volume = cols[1]; priceRaw = cols[2]; }
      else if (cols.length === 2) { name = cols[0]; priceRaw = cols[1]; }
      else { name = cols[0]; priceRaw = ""; }
      if (!name) return;
      var priceNum = parseFloat(String(priceRaw).replace(/[¥,\s]/g, ""));
      if (isNaN(priceNum)) priceNum = 0;
      items.push({ id: uid(), type: "item", name: name, volume: volume, unitPrice: priceNum });
    });
    return { items: items };
  }

  /* ---------------- COUNT tab ---------------- */
  var countSearch = "";
  var collapsedHeaders = {};

  function renderCount() {
    var main = $("#main"); main.innerHTML = "";
    var month = UI.countMonth || currentMonth(); UI.countMonth = month; saveUI();
    var rec = ensureMonth(month);

    main.appendChild(el("div", { class: "btn-row", style: "align-items:flex-end;margin-bottom:10px;flex-wrap:wrap" }, [
      el("div", { class: "field", style: "min-width:150px" }, [
        el("label", {}, ["対象月"]),
        el("input", { type: "month", value: month, onchange: function (e) { UI.countMonth = e.target.value || currentMonth(); saveUI(); renderCount(); } })
      ]),
      rec.finalizedAt ? el("span", { class: "chip teal" }, ["確定済み（" + new Date(rec.finalizedAt).toLocaleDateString("ja-JP") + "）"]) : el("span", { class: "chip gray" }, ["未確定（下書き）"])
    ]));

    var prevMonth = findPreviousMonthWithData(month);
    if (prevMonth && !rec.finalizedAt) {
      var hasOwnData = Object.keys(rec.counts).length > 0;
      main.appendChild(el("div", { class: "card" }, [el("div", { class: "card-body" }, [
        el("div", { style: "font-size:12.5px;font-weight:700;color:var(--navy-700)" }, ["前月（" + monthLabel(prevMonth) + "）の数値をコピー"]),
        el("div", { class: "hint" }, ["動きのない在庫はそのまま、変わった商品だけ直せば済みます。" + (hasOwnData ? "今月すでに入力した数値は上書きされます。" : "")]),
        el("button", { class: "btn primary sm", style: "align-self:flex-start", onclick: function () {
          confirmModal("前月（" + monthLabel(prevMonth) + "）の数値を今月にコピーします。" + (hasOwnData ? "今月すでに入力した数値は上書きされます。" : "") + "よろしいですか？", "コピーする", function () {
            rec.counts = Object.assign({}, DATA.months[prevMonth].counts);
            saveData(); toast("前月の数値をコピーしました"); renderCount();
          });
        } }, ["コピーする"])
      ])]));
    }

    if (!DATA.categories.length || !DATA.items.length) {
      main.appendChild(el("div", { class: "card" }, [el("div", { class: "card-body" }, [
        el("div", { class: "empty-note" }, ["まだ商品が登録されていません。「商品マスタ」タブから、Excelの棚卸表を貼り付けて取り込んでください。"])
      ])]));
      return;
    }

    var catId = UI.countCat || DATA.categories[0].id;
    if (!DATA.categories.find(function (c) { return c.id === catId; })) catId = DATA.categories[0].id;

    var subtabs = el("div", { class: "subtabs" }, DATA.categories.map(function (c) {
      var pr = categoryProgress(month, c.id);
      return el("button", { class: c.id === catId ? "active" : "", onclick: function () { UI.countCat = c.id; saveUI(); renderCount(); } }, [
        el("span", {}, [c.name]),
        el("span", { class: "badge" }, [pr.counted + "/" + pr.total]),
      ]);
    }));
    main.appendChild(subtabs);

    var pr = categoryProgress(month, catId);
    var pct = pr.total ? Math.round((pr.counted / pr.total) * 100) : 0;
    main.appendChild(el("div", { class: "progress-line" }, [
      el("div", { class: "progress-track" }, [el("div", { class: "progress-fill", style: "width:" + pct + "%" })]),
      el("div", { class: "progress-text" }, [pr.counted + " / " + pr.total + "件 入力済み"])
    ]));

    main.appendChild(el("div", { class: "search-row" }, [
      el("input", { type: "text", placeholder: "商品名で検索…", value: countSearch, oninput: function (e) { countSearch = e.target.value; renderCountList(catId, month); } })
    ]));

    main.appendChild(el("div", { id: "countList" }));
    renderCountList(catId, month);

    var bar = el("div", { class: "totalbar" });
    function refreshBar() {
      bar.innerHTML = "";
      bar.appendChild(el("div", { class: "row1" }, [
        el("div", {}, [el("div", { class: "lbl" }, ["総合計金額（全カテゴリ）"]), el("div", { class: "grand" }, [yen(monthGrandTotal(month))])]),
        el("div", { style: "text-align:right" }, [el("div", { class: "lbl" }, [DATA.categories.find(function (c) { return c.id === catId; }).name + " 小計"]), el("div", { style: "font-weight:700;font-variant-numeric:tabular-nums" }, [yen(monthCategoryTotal(month, catId))])])
      ]));
      var actions = el("div", { class: "btn-row" });
      if (!rec.finalizedAt) {
        actions.appendChild(el("button", { class: "btn primary", onclick: function () {
          confirmModal(monthLabel(month) + " の棚卸しを確定しますか？（後からでも取り消して編集できます）", "確定する", function () {
            rec.finalizedAt = new Date().toISOString(); saveData(); renderCount();
          });
        } }, ["この月を確定する"]));
      } else {
        actions.appendChild(el("button", { class: "btn", onclick: function () { rec.finalizedAt = null; saveData(); renderCount(); } }, ["確定を取り消す"]));
      }
      actions.appendChild(el("button", { class: "btn navy", onclick: function () { exportMonthCsv(month); } }, ["税理士提出用CSVを書き出す"]));
      bar.appendChild(actions);
    }
    refreshBar();
    window.__willowsRefreshBar = function () { refreshBar(); renderCountSubtabsBadges(month, catId); };
    main.appendChild(bar);
  }

  function renderCountSubtabsBadges(month, catId) {
    // cheap refresh of progress line + subtab badges without full re-render
    var main = $("#main");
    var badges = main.querySelectorAll(".subtabs button .badge");
    DATA.categories.forEach(function (c, i) {
      var pr = categoryProgress(month, c.id);
      if (badges[i]) badges[i].textContent = pr.counted + "/" + pr.total;
    });
    var pr2 = categoryProgress(month, catId);
    var pct = pr2.total ? Math.round((pr2.counted / pr2.total) * 100) : 0;
    var fill = main.querySelector(".progress-fill");
    var text = main.querySelector(".progress-text");
    if (fill) fill.style.width = pct + "%";
    if (text) text.textContent = pr2.counted + " / " + pr2.total + "件 入力済み";
  }

  function buildSections(items) {
    var sections = []; var current = null;
    items.forEach(function (it) {
      if (it.type === "header") { current = { headerId: it.id, label: it.name, items: [] }; sections.push(current); }
      else { if (!current) { current = { headerId: null, label: null, items: [] }; sections.push(current); } current.items.push(it); }
    });
    return sections;
  }

  function renderCountList(catId, month) {
    var listWrap = $("#countList"); if (!listWrap) return;
    listWrap.innerHTML = "";
    var rec = ensureMonth(month);
    var allItems = catItemsOrdered(catId);
    if (!allItems.length) { listWrap.appendChild(el("div", { class: "empty-note" }, ["このカテゴリにはまだ商品がありません。"])); return; }
    var q = countSearch.trim().toLowerCase();
    var sections = buildSections(allItems);

    var anyRendered = false;
    sections.forEach(function (sec) {
      var visItems = q ? sec.items.filter(function (it) { return it.name.toLowerCase().indexOf(q) >= 0; }) : sec.items;
      if (!visItems.length) return;
      anyRendered = true;
      var gTotal = visItems.reduce(function (s, it) { return s + itemValue(it, rec.counts[it.id] || 0); }, 0);
      var card = el("div", { class: "card" });
      if (sec.label !== null) {
        var collapsed = !!collapsedHeaders[sec.headerId];
        card.appendChild(el("div", { class: "group-head", onclick: function () { collapsedHeaders[sec.headerId] = !collapsed; renderCountList(catId, month); } }, [
          el("div", { class: "lbl" }, [(collapsed ? "▸ " : "▾ ") + sec.label]),
          el("div", { class: "meta" }, [visItems.length + "件 / " + yen(gTotal)])
        ]));
        if (collapsed) { listWrap.appendChild(card); return; }
      }
      var body = el("div", {});
      visItems.forEach(function (it) {
        var qty = rec.counts[it.id] || 0;
        var row = el("div", { class: "item-row" + (qty > 0 ? " counted" : "") });
        row.appendChild(el("div", { class: "item-info" }, [
          el("div", { class: "nm" }, [it.name]),
          el("div", { class: "meta" }, [(it.volume ? it.volume + " ／ " : "") + "@" + (it.unitPrice || 0).toLocaleString("ja-JP")])
        ]));
        var qtyInput = el("input", { type: "text", inputmode: "numeric", value: String(qty) });
        var valueSpan = el("div", { class: "item-value" }, [yen(itemValue(it, qty))]);
        function setQty(n) {
          n = Math.max(0, n || 0);
          rec.counts[it.id] = n; saveData();
          qtyInput.value = String(n);
          valueSpan.textContent = yen(itemValue(it, n));
          row.classList.toggle("counted", n > 0);
          if (window.__willowsRefreshBar) window.__willowsRefreshBar();
        }
        qtyInput.addEventListener("input", debounce(function () { setQty(parseInt(qtyInput.value, 10) || 0); }, 200));
        qtyInput.addEventListener("focus", function () { qtyInput.select(); });
        row.appendChild(el("div", { class: "stepper" }, [
          el("button", { type: "button", onclick: function () { setQty((rec.counts[it.id] || 0) - 1); } }, ["−"]),
          qtyInput,
          el("button", { type: "button", onclick: function () { setQty((rec.counts[it.id] || 0) + 1); } }, ["＋"])
        ]));
        row.appendChild(valueSpan);
        body.appendChild(row);
      });
      card.appendChild(body);
      listWrap.appendChild(card);
    });
    if (!anyRendered) listWrap.appendChild(el("div", { class: "empty-note" }, ["該当する商品がありません。"]));
  }

  function exportMonthCsv(month) {
    var rec = ensureMonth(month);
    var lines = [];
    lines.push(["カテゴリ", "見出し", "商品名", "容量", "仕入単価", "在庫数", "在庫高"].map(csvEscape).join(","));
    DATA.categories.forEach(function (cat) {
      var currentLabel = "";
      catItemsOrdered(cat.id).forEach(function (it) {
        if (it.type === "header") { currentLabel = it.name; return; }
        var qty = rec.counts[it.id] || 0;
        lines.push([cat.name, currentLabel, it.name, it.volume || "", it.unitPrice || 0, qty, itemValue(it, qty)].map(csvEscape).join(","));
      });
      lines.push(["", "", "", "", "", cat.name + " 小計", monthCategoryTotal(month, cat.id)].map(csvEscape).join(","));
    });
    lines.push(["", "", "", "", "", "総合計金額", monthGrandTotal(month)].map(csvEscape).join(","));
    var csv = "﻿" + lines.join("\r\n");
    offerDownload("WILLOWS_棚卸表_" + month + ".csv", csv, "text/csv;charset=utf-8");
  }

  /* ---------------- MASTER tab ---------------- */
  function openCategoryEditor() {
    function build() {
      var body = el("div", {});
      body.appendChild(el("h3", { style: "color:var(--navy-700);margin:0 0 14px;font-size:16px" }, ["カテゴリを編集"]));
      DATA.categories.forEach(function (c) {
        var row = el("div", { style: "display:flex;gap:6px;margin-bottom:8px;align-items:center" });
        var input = el("input", { type: "text", value: c.name });
        input.addEventListener("input", debounce(function () { c.name = input.value; saveData(); }, 300));
        row.appendChild(input);
        row.appendChild(el("button", { class: "btn sm danger", onclick: function () {
          confirmModal("「" + c.name + "」とその中の商品をすべて削除しますか？", "削除する", function () {
            DATA.items = DATA.items.filter(function (it) { return it.categoryId !== c.id; });
            DATA.categories = DATA.categories.filter(function (x) { return x.id !== c.id; });
            if (UI.masterCat === c.id) UI.masterCat = DATA.categories[0] ? DATA.categories[0].id : null;
            if (UI.countCat === c.id) UI.countCat = DATA.categories[0] ? DATA.categories[0].id : null;
            saveData(); saveUI(); closeModal(); openCategoryEditor(); renderMaster();
          });
        } }, ["削除"]));
        body.appendChild(row);
      });
      body.appendChild(el("div", { class: "btn-row", style: "margin-top:10px;justify-content:space-between" }, [
        el("button", { class: "btn sm", onclick: function () {
          formModal({
            title: "新しいカテゴリ", fields: [{ key: "name", label: "カテゴリ名", placeholder: "例：④その他" }],
            validate: function (v) { if (!v.name) return "カテゴリ名を入力してください"; },
            onSave: function (v) { var c = { id: uid(), name: v.name }; DATA.categories.push(c); UI.masterCat = c.id; saveData(); saveUI(); openCategoryEditor(); renderMaster(); }
          });
        } }, ["＋カテゴリ追加"]),
        el("button", { class: "btn primary sm", onclick: function () { closeModal(); renderMaster(); } }, ["閉じる"])
      ]));
      return body;
    }
    openModal(build());
  }

  function renderMaster() {
    var main = $("#main"); main.innerHTML = "";

    var catRow = el("div", { class: "btn-row", style: "margin-bottom:12px;align-items:center" });
    DATA.categories.forEach(function (c) {
      catRow.appendChild(el("button", { class: "btn sm" + (UI.masterCat === c.id ? " navy" : ""), onclick: function () { UI.masterCat = c.id; saveUI(); renderMaster(); } }, [c.name]));
    });
    catRow.appendChild(el("button", { class: "icon-btn", style: "color:var(--navy-700);border-color:var(--line-strong);background:var(--paper-1)", onclick: openCategoryEditor }, ["⚙"]));
    main.appendChild(catRow);

    var catId = UI.masterCat || (DATA.categories[0] && DATA.categories[0].id);
    if (!catId) { main.appendChild(el("div", { class: "empty-note" }, ["カテゴリがありません。右上の⚙から作成してください。"])); return; }
    var cat = DATA.categories.find(function (c) { return c.id === catId; });

    var importCard = el("div", { class: "card" }, [el("div", { class: "card-head" }, [cat.name + " に商品を取り込む"]), el("div", { class: "card-body" })]);
    var importBody = importCard.querySelector(".card-body");
    importBody.appendChild(el("div", { class: "hint" }, [
      "Excelで「名称・容量・仕入単価」（容量が無いシートは「名称・仕入単価」）の列を選んでコピーし、下に貼り付けてください。「店販商品」のような見出し行も、ひとまずそのまま貼り付けて大丈夫です（あとで見出しに変換できます）。"
    ]));
    var ta = el("textarea", { placeholder: "ここにExcelからコピーした内容を貼り付け" });
    importBody.appendChild(ta);
    importBody.appendChild(el("div", { class: "btn-row" }, [
      el("button", { class: "btn primary", onclick: function () {
        var parsed = parseImportText(ta.value);
        if (!parsed.items.length) { toast("取り込める商品が見つかりませんでした"); return; }
        parsed.items.forEach(function (it) { it.categoryId = catId; DATA.items.push(it); });
        saveData(); ta.value = "";
        toast(parsed.items.length + "件の商品を取り込みました");
        renderMaster();
      } }, ["取り込む"])
    ]));
    main.appendChild(importCard);

    var items = catItemsOrdered(catId);
    var listCard = el("div", { class: "card" }, [
      el("div", { class: "card-head" }, [
        el("span", {}, [cat.name + "（" + items.length + "件）"]),
        el("div", { class: "btn-row" }, [
          el("button", { class: "btn sm", onclick: function () { addHeaderModal(catId); } }, ["＋見出し"]),
          el("button", { class: "btn sm", onclick: function () { addItemModal(catId); } }, ["＋商品"])
        ])
      ])
    ]);
    var listBody = el("div", { style: "padding:4px 10px" });
    if (!items.length) listBody.appendChild(el("div", { class: "empty-note" }, ["まだ商品がありません。上の欄から取り込むか「＋商品」で追加してください。"]));
    items.forEach(function (it) {
      if (it.type === "header") {
        var hrow = el("div", { class: "master-row header-row" });
        var nameInput = el("input", { type: "text", class: "w-name", value: it.name, style: "font-weight:700" });
        nameInput.addEventListener("input", debounce(function () { it.name = nameInput.value; saveData(); }, 300));
        hrow.appendChild(nameInput);
        hrow.appendChild(el("div", { class: "master-actions" }, [
          el("button", { class: "btn sm", onclick: function () { it.type = "item"; it.unitPrice = it.unitPrice || 0; saveData(); renderMaster(); } }, ["商品に戻す"]),
          el("button", { class: "btn sm danger", onclick: function () {
            confirmModal("見出し「" + it.name + "」を削除しますか？（この下の商品は削除されません）", "削除する", function () { DATA.items = DATA.items.filter(function (x) { return x.id !== it.id; }); saveData(); renderMaster(); });
          } }, ["削除"])
        ]));
        listBody.appendChild(hrow);
        return;
      }
      var row = el("div", { class: "master-row" });
      var nameInput = el("input", { type: "text", class: "w-name", value: it.name });
      var volInput = el("input", { type: "text", class: "w-vol", value: it.volume || "", placeholder: "容量" });
      var priceInput = el("input", { type: "text", class: "w-price", value: String(it.unitPrice || 0), inputmode: "decimal" });
      nameInput.addEventListener("input", debounce(function () { it.name = nameInput.value; saveData(); }, 300));
      volInput.addEventListener("input", debounce(function () { it.volume = volInput.value; saveData(); }, 300));
      priceInput.addEventListener("input", debounce(function () { it.unitPrice = parseFloat(priceInput.value) || 0; saveData(); }, 300));
      row.appendChild(nameInput); row.appendChild(volInput); row.appendChild(priceInput);
      var catSelect = el("select", { onchange: function (e) { it.categoryId = e.target.value; saveData(); renderMaster(); } },
        DATA.categories.map(function (c) { return el("option", { value: c.id, selected: c.id === catId ? "selected" : null }, [c.name]); }));
      row.appendChild(catSelect);
      row.appendChild(el("div", { class: "master-actions" }, [
        el("button", { class: "btn sm", onclick: function () { it.type = "header"; saveData(); renderMaster(); } }, ["見出しに変換"]),
        el("button", { class: "btn sm danger", onclick: function () {
          confirmModal("「" + it.name + "」を削除しますか？", "削除する", function () { DATA.items = DATA.items.filter(function (x) { return x.id !== it.id; }); saveData(); renderMaster(); });
        } }, ["削除"])
      ]));
      listBody.appendChild(row);
    });
    listCard.appendChild(listBody);
    main.appendChild(listCard);
  }

  function addHeaderModal(catId) {
    formModal({
      title: "見出しを追加", fields: [{ key: "name", label: "見出し名（例：店販商品）" }],
      validate: function (v) { if (!v.name) return "見出し名を入力してください"; },
      onSave: function (v) { DATA.items.push({ id: uid(), categoryId: catId, type: "header", name: v.name, volume: "", unitPrice: 0 }); saveData(); renderMaster(); }
    });
  }
  function addItemModal(catId) {
    formModal({
      title: "商品を追加",
      fields: [{ key: "name", label: "商品名" }, { key: "volume", label: "容量（任意）" }, { key: "price", label: "仕入単価", numeric: true }],
      validate: function (v) { if (!v.name) return "商品名を入力してください"; },
      onSave: function (v) { DATA.items.push({ id: uid(), categoryId: catId, type: "item", name: v.name, volume: v.volume || "", unitPrice: parseFloat(v.price) || 0 }); saveData(); renderMaster(); }
    });
  }

  /* ---------------- HISTORY tab ---------------- */
  function renderHistory() {
    var main = $("#main"); main.innerHTML = "";
    var months = Object.keys(DATA.months).sort().reverse();
    var card = el("div", { class: "card" }, [el("div", { class: "card-head" }, ["月次履歴"])]);
    var body = el("div", { class: "card-body" });
    if (!months.length) body.appendChild(el("div", { class: "empty-note" }, ["まだ棚卸しの記録がありません。"]));
    months.forEach(function (m) {
      var rec = DATA.months[m];
      body.appendChild(el("div", { class: "btn-row", style: "justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)" }, [
        el("div", {}, [el("div", { style: "font-weight:700" }, [monthLabel(m)]), el("div", { class: "hint" }, [yen(monthGrandTotal(m))])]),
        rec.finalizedAt ? el("span", { class: "chip teal" }, ["確定済み"]) : el("span", { class: "chip amber" }, ["下書き"]),
        el("div", { class: "btn-row" }, [
          el("button", { class: "btn sm", onclick: function () { UI.countMonth = m; UI.tab = "count"; saveUI(); render(); } }, ["開く"]),
          el("button", { class: "btn sm navy", onclick: function () { exportMonthCsv(m); } }, ["CSV"])
        ])
      ]));
    });
    card.appendChild(body); main.appendChild(card);

    main.appendChild(el("div", { class: "card" }, [
      el("div", { class: "card-head" }, ["全データのバックアップ"]),
      el("div", { class: "card-body" }, [
        el("div", { class: "hint" }, ["機種変更の前などに、商品マスタと全月の記録をまとめてバックアップできます。"]),
        el("div", { class: "btn-row" }, [
          el("button", { class: "btn", onclick: function () { offerDownload("willows_inventory_backup_" + currentMonth() + ".json", JSON.stringify(DATA, null, 2), "application/json"); } }, ["全データ書き出し"]),
          el("button", { class: "btn", onclick: function () {
            confirmModal("バックアップを復元すると、今のデータは上書きされます。続けますか？", "復元する", function () {
              var input = el("input", { type: "file", accept: "application/json,.json", style: "display:none" });
              input.addEventListener("change", function () {
                var f = input.files && input.files[0]; if (!f) return;
                var reader = new FileReader();
                reader.onload = function () { try { DATA = JSON.parse(reader.result); saveData(); toast("復元しました"); render(); } catch (e) { toast("読み込みに失敗しました"); } };
                reader.readAsText(f);
              });
              document.body.appendChild(input); input.click();
              setTimeout(function () { document.body.removeChild(input); }, 3000);
            });
          } }, ["全データ復元"])
        ])
      ])
    ]));
  }

  /* ---------------- Tab switching ---------------- */
  function render() {
    $("#tabCount").classList.toggle("active", UI.tab === "count");
    $("#tabMaster").classList.toggle("active", UI.tab === "master");
    $("#tabHistory").classList.toggle("active", UI.tab === "history");
    $("#subline").textContent = UI.tab === "count" ? "在庫数を数えて入力するだけ" : UI.tab === "master" ? "商品マスタの管理" : "月次履歴とバックアップ";
    if (UI.tab === "count") renderCount();
    else if (UI.tab === "master") renderMaster();
    else renderHistory();
  }
  $("#tabCount").addEventListener("click", function () { UI.tab = "count"; saveUI(); render(); });
  $("#tabMaster").addEventListener("click", function () { UI.tab = "master"; saveUI(); render(); });
  $("#tabHistory").addEventListener("click", function () { UI.tab = "history"; saveUI(); render(); });

  render();
})();
</script>

</body>
</html>
